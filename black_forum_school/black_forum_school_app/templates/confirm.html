{% extends 'base.html' %}
{% load static %}
{% block title %}Подтверждение почты{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/header.css' %}">
<link rel="stylesheet" href="{% static 'css/reg.css' %}">
{% endblock %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="auth-card p-4 p-md-5 rounded-3">
                
                <h2 class="text-center mb-4 text-light">Подтверждение почты</h2>
                
                <p class="text-muted text-center">
                    Код отправлен на почту<br>
                    <strong class="text-light">{{ user_email }}</strong>
                </p>
                
                <div id="error-container" class="d-none"></div>
                <div id="success-container" class="d-none"></div>
                
                <form id="confirm-form">
                    {% csrf_token %}
                    
                    <input type="hidden" name="user_id" value="{{ user_id }}">
                    <input type="hidden" name="user_email" value="{{ user_email }}">
                    
                    <div class="mb-3">
                        <label for="email-code" class="form-label text-light">
                            Код подтверждения
                        </label>
                        <input
                            type="text"
                            id="email-code"
                            name="email-code"
                            class="form-control bg-dark text-light border-secondary"
                            placeholder="Введите 4-значный код"
                            maxlength="4"
                            required
                        >
                    </div>
                    
                    <button
                        type="submit"
                        id="confirm-button"
                        class="btn btn-primary w-100 py-2 mb-3"
                    >
                        Подтвердить
                    </button>
                    
                    <div class="text-center">
                        <a href="/reg/" class="text-info text-decoration-none">
                            Назад к регистрации
                        </a>
                    </div>
                </form>
                
            </div>
            
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>
$(document).ready(function() {
    
    $('#confirm-form').on('submit', function(e) {
        e.preventDefault();
        
        const code = $('#email-code').val().trim();
        
        if (!code) {
            $('#error-container')
                .html('<div class="alert alert-danger">Введите код</div>')
                .removeClass('d-none');
            return;
        }
        
        $('#confirm-button').prop('disabled', true).text('Проверка...');
        $('#error-container').addClass('d-none').empty();
        $('#success-container').addClass('d-none').empty();
        
        $.ajax({
            url: '/confirm/',
            type: 'POST',
            data: $(this).serialize(),
            dataType: 'json',
            success: function(response) {
                if (response.status === 'success') {
                    $('#success-container')
                        .html('<div class="alert alert-success">Успешно!</div>')
                        .removeClass('d-none');
                    
                    setTimeout(function() {
                        window.location.href = response.redirect || '/';
                    }, 500);
                } else {
                    $('#error-container')
                        .html('<div class="alert alert-danger">' + 
                            (response.message || 'Ошибка') + 
                        '</div>')
                        .removeClass('d-none');
                    $('#confirm-button').prop('disabled', false).text('Подтвердить');
                }
            },
            error: function(xhr) {
                let message = 'Ошибка сервера';
                try {
                    const response = JSON.parse(xhr.responseText);
                    if (response.message) message = response.message;
                } catch(e) {}
                
                $('#error-container')
                    .html('<div class="alert alert-danger">' + message + '</div>')
                    .removeClass('d-none');
                $('#confirm-button').prop('disabled', false).text('Подтвердить');
            }
        });
    });
    
});
</script>

{% endblock %}

{% include 'footer.html' %}
