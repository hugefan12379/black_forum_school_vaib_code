{% extends 'base.html' %}
{% load static %}
{% block title %}Вход в систему{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/header.css' %}">
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}

<form style="display:none;">
    {% csrf_token %}
</form>


<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <div class="auth-card p-4 rounded-3">
                <h2 class="text-center mb-4 text-light">Вход в аккаунт</h2>
                
                <div class="mb-3">
                    <label for="email" class="form-label text-light">Электронная почта</label>
                    <input type="email" 
                           class="form-control bg-dark text-light border-secondary" 
                           id="email" 
                           name="email" 
                           value="{{ request.GET.email }}" 
                           required>
                    <div id="emailHelp" class="form-text text-secondary">
                        Мы никому не расскажем вашу почту
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-light">Пароль</label>
                    <input type="password" 
                           class="form-control bg-dark text-light border-secondary" 
                           id="password" 
                           name="password" 
                           value="{{ request.GET.password }}" 
                           required>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" 
                           class="form-check-input bg-dark border-secondary" 
                           id="remember-me" 
                           name="remember_me">
                    <label class="form-check-label text-light" for="remember-me">
                        Запомнить меня
                    </label>
                </div>
                
                <!-- Сообщения об ошибках и успехе -->
                <div id="error-container" class="error-message alert alert-danger d-none"></div>
                <div id="success-container" class="success-message alert alert-success d-none"></div>
                
                <button type="button" id="auth-button" class="btn btn-primary w-100 py-2 mt-2">
                    Войти
                </button>
                
                <div class="text-center mt-4">
                    <a href="/reg" id="come-reg" class="text-info text-decoration-none">
                        Нет аккаунта? Зарегистрироваться
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="{% static 'js/run_awey.js' %}"></script>
<script>
$(document).ready(function() {
    function getUrlParameter(name) {
        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        var results = regex.exec(window.location.href);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    // Показываем сообщение об успешной регистрации
    var message = getUrlParameter('message');
    if (message) {
        $('#success-container')
            .text(decodeURIComponent(message))
            .removeClass('d-none')
            .show();
        
        setTimeout(function() {
            $('#success-container').fadeOut();
        }, 5000);
    }

    // Обработка входа
    $('#auth-button').on('click', function() {
        $('#error-container').addClass('d-none').empty();
        $('#success-container').addClass('d-none').empty();

        var email = $('#email').val().trim();
        var password = $('#password').val().trim();
        var rememberMe = $('#remember-me').is(':checked');

        if (!email || !password) {
            $('#error-container')
                .text('Заполните все поля')
                .removeClass('d-none');
            return;
        }

        $.ajax({
            url: '/auth/',
            type: 'POST',
            data: {
                'email': email,
                'password': password,
                'remember_me': rememberMe,
            },
            success: function(response) {
                if (response.status === 'success') {
                    window.location.href = response.redirect;
                } else {
                    $('#error-container')
                        .text(response.message)
                        .removeClass('d-none');
                }
            },
            error: function() {
                $('#error-container')
                    .text('Произошла ошибка при отправке запроса')
                    .removeClass('d-none');
            }
        });
    });

    // Enter для отправки
    $('#email, #password').on('keypress', function(e) {
        if (e.which === 13) {
            $('#auth-button').click();
        }
    });
});


        

</script>
{% endblock %}
