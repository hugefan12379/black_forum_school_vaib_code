{% csrf_token %}
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/auth.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href={% static 'css/auth.css' %}>
    <style>
        /* Небольшие дополнительные стили для сообщений об ошибках */
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .success-message {
            color: #28a745;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>

<body>
<div class="auth">
    <div class="mb-3">
        <label for="email" class="form-label">Электронная почта</label>
        <input type="email" class="form-control" id="email" name="email" aria-describedby="emailHelp" value="{{ request.GET.email }}" required>
        <div id="emailHelp" class="form-text">Мы никому не расскажем вашу почту</div>
    </div>
    
    <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" value="{{ request.GET.password }}" required>
    </div>
    
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember-me" name="remember_me">
        <label class="form-check-label" for="remember-me">Запомнить меня</label>
    </div>
    
    <!-- Контейнер для сообщений об ошибках -->
    <div id="error-container" class="error-message"></div>
    
    <!-- Контейнер для сообщений об успехе -->
    <div id="success-container" class="success-message"></div>
    
    <button type="button" id="auth-button" class="btn btn-primary">Подтвердить</button>
    <br>
    <a href="/reg">Нет аккаунта? Зарегистрироваться</a>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="{% static 'js/run_awey.js' %}"></script>

<script>
$(document).ready(function() {
    // Функция для получения параметра из URL
    function getUrlParameter(name) {
        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        var results = regex.exec(window.location.href);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    // Проверяем, есть ли сообщение об успешной регистрации
    var message = getUrlParameter('message');
    if (message) {
        $('#success-container').text(decodeURIComponent(message)).show();
        // Автоматически скрываем через 5 секунд
        setTimeout(function() {
            $('#success-container').fadeOut();
        }, 5000);
    }

    // Обработка клика по кнопке подтверждения
    $('#auth-button').on('click', function() {
        // Скрываем предыдущие сообщения
        $('#error-container').hide().empty();
        $('#success-container').hide().empty();
        
        var email = $('#email').val();
        var password = $('#password').val();
        var rememberMe = $('#remember-me').is(':checked');
        
        // Валидация на клиенте
        if (!email || !password) {
            $('#error-container').text('Заполните все поля').show();
            return;
        }
        
        // Отправка AJAX-запроса
        $.ajax({
            url: '/auth/',
            type: 'POST',
            data: {
                'email': email,
                'password': password,
                'remember_me': rememberMe,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            success: function(response) {
                if (response.status === 'success') {
                    // Успешный вход - перенаправляем на главную
                    window.location.href = response.redirect;
                } else {
                    // Ошибка - показываем сообщение
                    $('#error-container').text(response.message).show();
                }
            },
            error: function(xhr, status, error) {
                $('#error-container').text('Произошла ошибка при отправке запроса').show();
                console.error('Error:', error);
            }
        });
    });

    // Обработка нажатия Enter в полях ввода
    $('#email, #password').on('keypress', function(e) {
        if (e.which === 13) { // Enter key
            $('#auth-button').click();
        }
    });
});
</script>

</body>
</html>
